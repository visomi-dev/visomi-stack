name: themis-production-like

# Generate deploy/production.env from the Railway/project secret variables
# before starting this file. Run `pnpm db:migrate` explicitly against the
# PostgreSQL service; the gateway never runs migrations implicitly.

services:
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    env_file: ./production.env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      GATEWAY_PORT: 8080
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/themis
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      OPAQUE_SYNC_S3_ENDPOINT: http://object-storage:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    ports:
      - '8080:8080'
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/readyz').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: themis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d themis']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: docker.io/library/redis:7-alpine
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD}']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:?set REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

  object-storage:
    image: quay.io/minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ADMIN_USER:?set S3_ADMIN_USER}
      MINIO_ROOT_PASSWORD: ${S3_ADMIN_PASSWORD:?set S3_ADMIN_PASSWORD}
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  redis-data:
  object-storage-data:

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2, basicauth/ingest]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    logs:
      level: warn
    metrics:
      level: none

extensions:
  basicauth/ingest:
    htpasswd:
      inline: ${env:JAEGER_HTPASSWD}
  healthcheckv2:
    use_v2: true
    http:
      endpoint: '[::]:13133'
  jaeger_query:
    http:
      endpoint: '[::]:16686'
    storage:
      traces: operational
  jaeger_storage:
    backends:
      operational:
        badger:
          directories:
            keys: /badger/keys
            values: /badger/values
          ephemeral: false
          ttl:
            spans: 48h

receivers:
  otlp:
    protocols:
      http:
        endpoint: '[::]:4318'
        auth:
          authenticator: basicauth/ingest

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 64
  batch:
    send_batch_size: 128
    send_batch_max_size: 128
    timeout: 1s

exporters:
  jaeger_storage_exporter:
    trace_storage: operational

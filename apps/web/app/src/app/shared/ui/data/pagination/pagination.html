<nav class="flex items-center justify-between gap-3" aria-label="Pagination">
  <button
    class="ui-focus-ring rounded-[var(--radius-control)] border border-slate-500/30 px-3 py-2 text-sm font-medium disabled:opacity-50 dark:border-slate-400/30"
    [disabled]="!canGoPrevious()"
    type="button"
    (click)="goToPage(page() - 1)"
  >
    Previous
  </button>
  <span class="text-sm text-slate-500 dark:text-slate-400">Page {{ page() }} of {{ pageCount() }}</span>
  <button
    class="ui-focus-ring rounded-[var(--radius-control)] border border-slate-500/30 px-3 py-2 text-sm font-medium disabled:opacity-50 dark:border-slate-400/30"
    [disabled]="!canGoNext()"
    type="button"
    (click)="goToPage(page() + 1)"
  >
    Next
  </button>
</nav>

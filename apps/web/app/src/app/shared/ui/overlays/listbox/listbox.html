<ul
  cdkListbox
  [id]="generatedId"
  [attr.aria-label]="ariaLabel()"
  [cdkListboxMultiple]="false"
  (cdkListboxValueChange)="handleValueChange($any($event))"
  (blur)="handleBlur()"
  class="ui-focus-ring grid gap-1 rounded-[var(--radius-panel)] bg-slate-50 p-1 dark:bg-slate-900"
>
  @for (option of options(); track option.value) {
    <li
      cdkOption
      [cdkOption]="option.value"
      [cdkOptionDisabled]="option.disabled ?? false"
      [class]="optionClasses(option.value, option)"
    >
      {{ option.label }}
    </li>
  }
</ul>

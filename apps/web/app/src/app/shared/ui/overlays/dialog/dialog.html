@if (open()) {
  <div class="fixed inset-0 z-50 grid place-items-center p-4" tabindex="-1" (keydown)="handleKeydown($event)">
    <button
      aria-label="Close dialog"
      class="absolute inset-0 bg-black/45"
      type="button"
      (click)="closeDialog()"
    ></button>
    <section
      cdkTrapFocus
      cdkTrapFocusAutoCapture
      class="ui-panel-raised relative z-10 grid max-h-[min(42rem,90vh)] w-full max-w-xl gap-4 overflow-auto p-4 md:p-6"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="ariaLabelledBy()"
    >
      <ng-content />
    </section>
  </div>
}

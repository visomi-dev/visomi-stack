<div class="min-h-screen lg:grid lg:grid-cols-[18rem_minmax(0,1fr)]">
  @if (mobileMenuOpen()) {
    <button
      aria-label="Close navigation"
      class="fixed inset-0 z-30 bg-black/40 lg:hidden"
      type="button"
      (click)="mobileMenuClose.emit()"
    ></button>
  }

  <aside
    class="fixed inset-y-0 left-0 z-40 w-72 bg-slate-100 transition lg:static lg:z-auto lg:w-auto dark:bg-slate-800"
    [class.-translate-x-full]="!mobileMenuOpen()"
    [class.lg:translate-x-0]="true"
  >
    <ng-content select="app-sidebar,[data-slot=sidebar]" />
  </aside>

  <div class="min-w-0">
    <ng-content select="app-topbar,[data-slot=topbar]" />
    <main class="px-4 py-6 md:px-8 md:py-10"><ng-content /></main>
  </div>
</div>

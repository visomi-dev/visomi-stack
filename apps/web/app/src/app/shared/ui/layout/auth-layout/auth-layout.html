<header
  data-od-id="auth-shell"
  class="sticky top-0 z-20 border-b border-slate-950/10 bg-white/85 backdrop-blur-md dark:border-white/10 dark:bg-slate-950/85"
>
  <div class="mx-auto flex max-w-7xl items-center justify-between gap-3 px-4 py-2.5 sm:gap-4 sm:px-6 sm:py-3">
    <a
      data-od-id="brand"
      routerLink="/"
      class="font-heading inline-flex items-center gap-2 font-bold tracking-tight text-slate-950 sm:gap-2.5 dark:text-slate-50"
      aria-label="Visomi Stack home"
    >
      <app-logo variant="mark-name" size="sm" />
    </a>

    <div class="flex items-center gap-1.5 sm:gap-2">
      <app-lang-switcher [options]="languages" />
      <app-theme-switcher variant="toggle" />
    </div>
  </div>
</header>

<main
  class="grid min-h-0 min-w-0 flex-1 place-items-center overflow-y-auto bg-white px-4 py-8 sm:py-10 md:px-6 md:py-14 dark:bg-slate-950"
>
  <ng-content />
</main>

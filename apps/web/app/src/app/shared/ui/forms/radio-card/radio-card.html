<label [class]="classes()" [attr.aria-busy]="loading()">
  <input
    class="absolute inset-0 size-full cursor-pointer opacity-0 disabled:cursor-not-allowed"
    data-slot="control"
    type="radio"
    [attr.aria-invalid]="isInvalid()"
    [attr.aria-describedby]="ariaDescribedBy()"
    [checked]="checked()"
    [disabled]="isDisabled()"
    [id]="inputId()"
    [name]="name()"
    [required]="required()"
    [value]="optionValue()"
    (blur)="onBlur()"
    (change)="select()"
  />

  <ng-content />

  <span [class]="markerClasses()" aria-hidden="true">
    <app-icon name="check" />
  </span>
</label>

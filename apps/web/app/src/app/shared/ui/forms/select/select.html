<select
  #selectEl
  [disabled]="disabled() || formField()().disabled()"
  [attr.aria-describedby]="ariaDescribedBy()"
  [attr.aria-invalid]="invalid() || (formField()().touched() && formField()().invalid())"
  [attr.id]="controlId()"
  [attr.name]="name()"
  [attr.required]="required() ? '' : null"
  [class]="classes()"
  data-slot="control"
  (blur)="onBlur()"
  (change)="onChangeEvent($event)"
>
  <ng-content />
  <ng-container [ngTemplateOutlet]="options()?.template ?? null" />
</select>

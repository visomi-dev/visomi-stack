<fieldset
  class="grid min-w-0 gap-3"
  [disabled]="isDisabled()"
  [attr.aria-describedby]="ariaDescribedBy()"
  [attr.aria-busy]="loading()"
>
  @if (legend()) {
    <legend class="text-sm font-semibold text-slate-950 dark:text-slate-50">{{ legend() }}</legend>
  }

  <div
    class="grid gap-3"
    [class.sm:grid-flow-col]="layout() === 'responsive'"
    [class.sm:auto-cols-fr]="layout() === 'responsive'"
  >
    @for (option of options(); track option.value) {
      <label [class]="optionClasses()">
        <input
          class="mt-0.5 size-4 shrink-0 accent-blue-600 dark:accent-blue-400"
          data-slot="control"
          [attr.aria-invalid]="isInvalid()"
          [required]="required()"
          [disabled]="isDisabled() || option.disabled === true"
          [attr.aria-labelledby]="name() + '-' + $index + '-label'"
          [attr.aria-describedby]="option.description ? name() + '-' + $index + '-description' : null"
          [checked]="value() === option.value"
          [name]="name()"
          [value]="option.value"
          type="radio"
          (blur)="onBlur()"
          (change)="selectValue(option.value)"
        />
        <ng-container *ngTemplateOutlet="optionTemplate().template; context: optionContext(option, $index)" />
      </label>
    }
  </div>
</fieldset>

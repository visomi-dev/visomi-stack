<div class="relative">
  <input
    #inputEl
    [disabled]="!ready() || disabled() || loading() || formField()().disabled()"
    [attr.aria-describedby]="ariaDescribedBy()"
    [attr.aria-invalid]="invalid() || (formField()().touched() && formField()().invalid())"
    [attr.autocomplete]="autocomplete()"
    [attr.id]="controlId()"
    [attr.maxlength]="maxLength()"
    [attr.minlength]="minLength()"
    [attr.name]="name()"
    [attr.pattern]="pattern() || null"
    [attr.required]="required() ? '' : null"
    [class]="inputClasses()"
    [placeholder]="placeholder() || ' '"
    [type]="type()"
    data-slot="control"
    (blur)="onBlur()"
    (input)="onInput($event)"
  />

  @if (isTextVariant()) {
    <button [class]="toggleClasses()" type="button" [attr.aria-label]="ariaLabel()" (click)="toggleType()">
      {{ toggleLabel() }}
    </button>
  } @else {
    <button
      [class]="toggleClasses()"
      type="button"
      [attr.aria-label]="isVisible() ? 'Hide password' : 'Show password'"
      (click)="toggleType()"
    >
      <app-icon [name]="isVisible() ? 'eye-off' : 'eye'" />
    </button>
  }

  @if (loading()) {
    <span
      aria-hidden="true"
      class="absolute top-1/2 right-5 size-4 -translate-y-1/2 animate-spin rounded-full border-2 border-current border-r-transparent"
    ></span>
  }
</div>
@if (showStrength()) {
  <app-password-strength class="mt-3" [password]="formField()().value" [id]="controlId() + '-strength'" />
  <p class="mt-1 text-xs text-slate-500 dark:text-slate-400" [class.text-green-700]="meetsLength()" aria-live="polite">
    @if (meetsLength()) {
      <span i18n="@@passwordLengthMet">Length requirement met (12–128 characters).</span>
    } @else {
      <span i18n="@@passwordLengthRequirement">Use 12–128 characters. Spaces and Unicode are welcome.</span>
    }
  </p>
}

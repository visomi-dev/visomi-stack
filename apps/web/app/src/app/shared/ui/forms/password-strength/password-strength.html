<div [class]="containerClasses()" data-slot="password-strength" [attr.data-level]="level()" aria-hidden="true">
  <div class="grid grid-cols-4 gap-1.5">
    @for (bar of [0, 1, 2, 3]; track bar) {
      <span [class]="barClasses(bar + 1)"></span>
    }
  </div>
</div>
<span
  [id]="id()"
  [class]="labelClasses()"
  data-slot="password-strength-label"
  [attr.aria-describedby]="describedBy()"
  aria-live="polite"
  >{{ label() }}</span
>

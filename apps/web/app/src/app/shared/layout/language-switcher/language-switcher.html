<app-dropdown>
  <button
    data-slot="trigger"
    type="button"
    class="ui-focus-ring flex min-h-11 items-center gap-2 rounded-sm px-2 text-xs font-semibold tracking-widest text-slate-500 uppercase transition-colors hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-slate-800"
    aria-label="Change language"
    i18n-aria-label="@@languageSwitcherChangeLanguage"
  >
    <app-icon name="globe" />
    <span [class.lg:hidden]="compact()">{{ currentLocaleLabel() }}</span>
    <app-icon name="angle-down" class="text-xs" [class.lg:hidden]="compact()" />
  </button>

  <div>
    <a
      class="ui-focus-ring flex items-center rounded-[var(--radius-control)] px-3 py-2 text-sm text-slate-950 hover:bg-slate-50 dark:bg-slate-900 dark:text-slate-50"
      [href]="localeUrl('en')"
      role="menuitem"
    >
      <span i18n="@@languageSwitcherEnglishOption">English</span>
    </a>
    <a
      class="ui-focus-ring flex items-center rounded-[var(--radius-control)] px-3 py-2 text-sm text-slate-950 hover:bg-slate-50 dark:bg-slate-900 dark:text-slate-50"
      [href]="localeUrl('es')"
      role="menuitem"
    >
      <span i18n="@@languageSwitcherSpanishOption">Spanish</span>
    </a>
  </div>
</app-dropdown>

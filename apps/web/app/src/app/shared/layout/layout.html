@if (showAppShell()) {
  <div
    class="flex h-dvh min-h-0 flex-col overflow-hidden bg-white text-slate-950 [--bottom-nav-height:4rem] lg:[--bottom-nav-height:0] dark:bg-slate-950 dark:text-slate-50"
  >
    <div class="flex min-h-0 flex-1">
      <app-sidebar-menu
        [collapsed]="sidebarCollapsed()"
        [mobileMenuOpen]="mobileMenuOpen()"
        (closed)="closeMobileMenu()"
        (toggleCollapsed)="toggleSidebarCollapsed()"
      />

      <section class="flex min-h-0 min-w-0 flex-1 flex-col" [attr.inert]="mobileMenuOpen() ? '' : null">
        @if (pageTitles.template(); as title) {
          <header class="shrink-0 px-4 pt-4 md:px-8 md:pt-6" data-slot="page-title">
            <ng-container [ngTemplateOutlet]="title" />
          </header>
        }
        @if (appUpdates.ready()) {
          <aside
            class="flex flex-wrap items-center justify-between gap-3 bg-slate-100 px-4 py-3 text-sm dark:bg-slate-800"
            role="status"
          >
            <span i18n="@@layoutUpdateReady">
              An application update is ready. Reload when you have saved your work.
            </span>
            <app-button (click)="appUpdates.reload()">
              <span i18n="@@layoutUpdateReload">Reload application</span>
            </app-button>
          </aside>
        }
        <div class="min-h-0 min-w-0 flex-1 overflow-y-auto bg-white px-4 py-4 md:px-8 md:py-6 dark:bg-slate-950">
          <router-outlet />
        </div>

        <app-bottom-navigation>
          @for (item of bottomNavItems; track item.url) {
            <app-bottom-navigation-item [ariaLabel]="item.ariaLabel" [routerLink]="item.url" [exact]="item.exact">
              <app-icon data-slot="icon" [name]="item.icon" />
            </app-bottom-navigation-item>
          }
          <app-bottom-navigation-action
            ariaLabel="Open navigation"
            i18n-ariaLabel="@@layoutOpenNavigation"
            (pressed)="openMobileMenu()"
          >
            <app-icon data-slot="icon" name="bars" />
          </app-bottom-navigation-action>
        </app-bottom-navigation>
      </section>
    </div>
  </div>
} @else {
  <router-outlet />
}

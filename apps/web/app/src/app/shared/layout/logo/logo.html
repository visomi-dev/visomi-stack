@if (variant() === 'mark' || variant() === 'mark-name') {
  <svg
    class="brand-mark h-7 w-7 shrink-0 text-blue-600 dark:text-blue-400"
    viewBox="0 0 48 48"
    fill="none"
    aria-hidden="true"
  >
    <path class="brand-mark-frame" d="M7 11.5h34M7 36.5h34" stroke="currentColor" stroke-width="2" />
    <path
      class="brand-mark-path"
      d="M10 17.5 24 31l14-13.5M24 31V11.5"
      stroke="currentColor"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="10" cy="17.5" r="2.75" fill="currentColor" />
    <circle cx="24" cy="31" r="2.75" fill="currentColor" />
    <circle cx="38" cy="17.5" r="2.75" fill="currentColor" />
  </svg>
}

@if (variant() === 'isotype') {
  <svg class="brand-mark h-8 w-8 text-blue-600 dark:text-blue-400" viewBox="0 0 48 48" fill="none" aria-hidden="true">
    <path class="brand-mark-frame" d="M7 11.5h34M7 36.5h34" stroke="currentColor" stroke-width="2" />
    <path
      class="brand-mark-path"
      d="M10 17.5 24 31l14-13.5M24 31V11.5"
      stroke="currentColor"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="10" cy="17.5" r="2.75" fill="currentColor" />
    <circle cx="24" cy="31" r="2.75" fill="currentColor" />
    <circle cx="38" cy="17.5" r="2.75" fill="currentColor" />
  </svg>
}

@if (variant() === 'wordmark' || variant() === 'mark-name') {
  <span
    class="font-heading text-base font-extrabold tracking-[-0.03em] text-zinc-950 sm:text-[1.0625rem] dark:text-zinc-50"
    >Visomi Stack</span
  >
}

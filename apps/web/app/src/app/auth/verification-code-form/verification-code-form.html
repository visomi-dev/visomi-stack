@if (statusMessage()) {
  <app-alert tone="success">{{ statusMessage() }}</app-alert>
}

<app-form class="grid gap-4" [form]="verificationForm">
  <app-field [manualError]="pinManualError() ?? ''">
    <app-label for="verification-pin-1" i18n="@@verificationCodeLabel">Verification code</app-label>
    <app-pin-input
      [digits]="6"
      digitPattern="[0-9]{1}"
      [loading]="submitting()"
      [formField]="verificationForm.pin"
      idPrefix="verification-pin"
    />
    <app-description i18n="@@verificationCodeHelp">Enter the 6-digit code from your email.</app-description>
    <app-error-message controlId="verification-pin-error" i18n="@@verificationCodeErrorLength">{{
      resolvedPinError()
    }}</app-error-message>
  </app-field>

  <div class="grid gap-3">
    <app-button
      i18n="@@verificationCodeSubmitButton"
      tone="accent"
      type="submit"
      [fullWidth]="true"
      [loading]="submitting()"
    >
      Verify and continue
    </app-button>
    <app-button
      i18n="@@verificationCodeResendButton"
      type="button"
      variant="plain"
      [fullWidth]="true"
      (click)="resend.emit()"
    >
      Resend code
    </app-button>
  </div>

  @if (errorMessage()) {
    <app-alert tone="danger" variant="auth">{{ errorMessage() }}</app-alert>
  }
</app-form>

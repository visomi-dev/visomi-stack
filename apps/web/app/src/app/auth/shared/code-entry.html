<form novalidate [attr.data-submitted]="attempted() ? '' : null" (submit)="verify($event)" class="space-y-5">
  <app-field
    #field="appField"
    control-id="verification-code"
    [label]="label"
    [description]="backup() ? '' : codeLength"
    data-show-error
    [invalid]="attempted() && fields.code().invalid()"
    [error]="attempted() ? (fields.code().errors()[0]?.message ?? '') : ''"
  >
    @if (backup()) {
      <input
        appUI
        [formField]="fields.code"
        [id]="field.controlId()"
        [attr.aria-describedby]="field.describedBy()"
        [attr.aria-invalid]="field.invalid()"
        autocomplete="off"
        placeholder=" "
      />
    } @else {
      <app-pin-input [formField]="fields.code" type="text" autocomplete="one-time-code" />
    }
  </app-field>

  <button
    appUI
    type="submit"
    class="w-full"
    [disabled]="busy()"
    [attr.aria-busy]="loading() ?? busy()"
    i18n="@@authVerify"
  >
    Verify
  </button>
</form>

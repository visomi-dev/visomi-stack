<section class="space-y-4">
  <p appUI i18n="@@authBackupSave">
    Save these codes somewhere safe. We’ll only show them once and each works once. If you create new codes, these stop
    working.
  </p>

  <ul class="grid gap-2 rounded-xl bg-zinc-100 p-4 font-mono text-sm sm:grid-cols-2 dark:bg-zinc-800">
    @for (code of codes(); track code) {
      <li class="break-all">{{ code }}</li>
    }
  </ul>

  <div class="flex flex-col gap-3 sm:flex-row sm:flex-wrap">
    <button
      appUI
      variant="secondary"
      (click)="copy()"
      i18n="@@authCopyCodes"
      [attr.aria-busy]="action.pending() === 'copy'"
    >
      Copy codes
    </button>

    <a
      appUI="button"
      variant="secondary"
      [href]="downloadUrl()"
      download="visomi-backup-codes.txt"
      [attr.aria-disabled]="!downloadUrl()"
      (click)="!downloadUrl() && $event.preventDefault()"
      i18n="@@authDownloadCodes"
    >
      Download codes
    </a>
  </div>

  <app-auth-feedback [action]="action" />
</section>

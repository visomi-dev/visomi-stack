<section class="flex min-w-0 flex-col gap-6">
  <header class="space-y-3">
    <h1 appUI appNavigationHeading>{{ title }}</h1>

    <p appUI tone="muted">{{ description }}</p>
  </header>

  <form novalidate class="space-y-5" [attr.data-submitted]="attempted() ? '' : null" (submit)="send($event)">
    <app-field
      #emailField="appField"
      control-id="password-email"
      [label]="emailLabel"
      [error]="fields.email().errors()[0]?.message ?? ''"
    >
      <input
        appUI
        [formField]="fields.email"
        id="password-email"
        type="email"
        [attr.autocomplete]="signup ? 'email' : 'username webauthn'"
        placeholder=" "
        [attr.aria-invalid]="fields.email().touched() && fields.email().invalid()"
        [attr.aria-describedby]="emailField.describedBy()"
      />
    </app-field>

    <app-field
      #passwordField="appField"
      control-id="account-password"
      [label]="passwordLabel"
      [description]="signup ? policy : ''"
      [error]="fields.password().errors()[0]?.message ?? ''"
    >
      <div class="relative">
        <input
          appUI
          [formField]="fields.password"
          id="account-password"
          [type]="visible() ? 'text' : 'password'"
          [attr.autocomplete]="signup ? 'new-password' : 'current-password'"
          placeholder=" "
          class="pr-24"
          [attr.aria-invalid]="fields.password().touched() && fields.password().invalid()"
          [attr.aria-describedby]="passwordField.describedBy()"
        />

        <button
          appUI
          variant="ghost"
          size="sm"
          type="button"
          class="absolute inset-y-0 right-0 min-w-16"
          aria-controls="account-password"
          aria-label="Show or hide password"
          i18n-aria-label="@@authTogglePassword"
          [attr.aria-pressed]="visible()"
          (click)="visible.set(!visible())"
        >
          {{ visible() ? hideLabel : showLabel }}
        </button>
      </div>
    </app-field>

    <button appUI type="submit" class="w-full" [disabled]="action.busy()" [attr.aria-busy]="action.busy()">
      {{ signup ? createLabel : signInLabel }}
    </button>
  </form>

  <app-auth-feedback [action]="action" [indicator]="false" />

  @if (!signup) {
    <a
      appUI
      routerLink="/auth/forgot-password"
      class="inline-flex min-h-11 items-center justify-center text-center text-sm"
      i18n="@@authForgotPassword"
    >
      Forgot your password?
    </a>
  }

  <a
    appUI
    [routerLink]="signup ? '/auth/sign-up' : '/auth/sign-in'"
    [queryParams]="navigation.returnQuery()"
    class="inline-flex min-h-11 items-center justify-center border-t border-zinc-200 pt-5 text-center text-sm dark:border-zinc-800"
    i18n="@@authOtherMethod"
  >
    Choose another method
  </a>
</section>

<section class="flex min-w-0 flex-col gap-6">
  <header class="space-y-3">
    <h1 appUI appNavigationHeading i18n="@@authResetRequestTitle">Reset your password</h1>

    <p appUI tone="muted" i18n="@@authRecoveryUniform">
      If this email can be used for recovery, we will send a code. Additional verification may be required.
    </p>
  </header>

  <app-email-entry [busy]="action.busy()" (confirmed)="request($event)" />

  <app-auth-feedback [action]="action" />

  <footer
    class="flex flex-col items-center gap-3 border-t border-zinc-200 pt-5 text-center text-sm dark:border-zinc-800"
  >
    <a
      appUI
      routerLink="/auth/sign-in/password"
      class="inline-flex min-h-11 items-center justify-center text-center"
      i18n="@@authBackSignIn"
    >
      Back to sign in
    </a>
  </footer>
</section>

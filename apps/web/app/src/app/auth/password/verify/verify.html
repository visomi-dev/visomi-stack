<section class="flex min-w-0 flex-col gap-6">
  <h1 appUI appNavigationHeading i18n="@@authConfirmSignIn">Confirm your sign-in</h1>

  @if (pending(); as pending) {
    <p appUI tone="muted">{{ pending.factor === 'email' ? emailHint : totpHint }}</p>

    <app-code-entry
      [auto-submit]="pending.factor === 'email'"
      [busy]="action.busy()"
      [backup]="backup()"
      (confirmed)="verify($event)"
      [loading]="action.pending() === 'verify'"
    />

    @if (pending.factor === 'email') {
      <app-resend-code />
    } @else {
      <button appUI variant="secondary" class="w-full" [disabled]="action.busy()" (click)="switchVerificationMethod()">
        {{ backup() ? useAuthenticator : useBackup }}
      </button>
    }
  } @else {
    <div appUI="alert" tone="warning" role="status" i18n="@@authRestartChallenge">
      We couldn’t resume verification. Start again to request a new code.
    </div>
  }

  <app-auth-feedback [action]="action" />

  <a
    appUI
    routerLink="/auth/sign-in/password"
    [queryParams]="navigation.returnQuery()"
    class="inline-flex min-h-11 items-center justify-center text-center text-sm"
    i18n="@@authStartAgain"
  >
    Start again
  </a>
</section>

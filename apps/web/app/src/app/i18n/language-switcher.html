<nav [class]="compact() ? 'flex gap-3' : 'flex items-center gap-2'" aria-label="Language" i18n-aria-label="@@language">
  @if (!compact() && locale.startsWith('en')) {
    <span lang="en" aria-current="true" class="inline-flex min-h-11 items-center text-sm font-medium">English</span>
  } @else {
    <a
      appUI
      variant="muted"
      [underline]="compact() ? 'none' : 'hover'"
      [class]="linkClasses()"
      [href]="english()"
      hreflang="en"
      lang="en"
    >
      {{ compact() ? 'EN' : 'English' }}
    </a>
  }

  @if (!compact() && !locale.startsWith('en')) {
    <span lang="es" aria-current="true" class="inline-flex min-h-11 items-center text-sm font-medium">Español</span>
  } @else {
    <a
      appUI
      variant="muted"
      [underline]="compact() ? 'none' : 'hover'"
      [class]="linkClasses()"
      [href]="spanish()"
      hreflang="es"
      lang="es"
    >
      {{ compact() ? 'ES' : 'Español' }}
    </a>
  }
</nav>

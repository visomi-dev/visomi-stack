<ns0:mask id="visomi-loader-center-mask-1" maskUnits="userSpaceOnUse" x="-60" y="-60" width="665" height="667" style="mask-type:luminance"><ns0:path class="visomi-loader-draw" pathLength="100" d="M 382 251 L 376 301 L 188 400 L 130 400 L 100 377 L 52 287 L 52 269 L 85 224 L 179 224" style="animation-name:visomi-loader-draw-1" /></ns0:mask>
<ns0:mask id="visomi-loader-center-mask-2" maskUnits="userSpaceOnUse" x="-60" y="-60" width="665" height="667" style="mask-type:luminance"><ns0:path class="visomi-loader-draw" pathLength="100" d="M 281 160 L 328 160 L 494 257 L 505 277 L 505 380 L 491 400 L 326 518 L 306 510 L 306 395" style="animation-name:visomi-loader-draw-2" /></ns0:mask>
</ns0:defs>

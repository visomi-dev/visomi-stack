<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 545 547" role="img" aria-labelledby="visomi-loader-center-title visomi-loader-center-desc">
<ns0:title id="visomi-loader-center-title">Visomi: indicador de carga</ns0:title>
<ns0:desc id="visomi-loader-center-desc">Las cintas negras se dibujan en orden arriba, izquierda y derecha, y se desvanecen suavemente antes de repetir. Con movimiento reducido se muestra el isotipo completo.</ns0:desc>

<ns0:style>
.visomi-loader-draw {fill:none;stroke:white;stroke-width:104;stroke-linejoin:round;stroke-linecap:square;stroke-dasharray:100 200;stroke-dashoffset:0;animation-duration:1.6s;animation-timing-function:linear;animation-iteration-count:infinite;}
.visomi-loader-ink {animation:visomi-loader-fade 1.6s linear infinite;}
@keyframes visomi-loader-fade {0%,78%{opacity:1} 78%{animation-timing-function:ease-in-out} 100%{opacity:0}}
@keyframes visomi-loader-draw-0 {0%,0.000000%{stroke-dashoffset:100;opacity:0} 1.250000%{opacity:1} 21.767477%,100%{stroke-dashoffset:0;opacity:1}}
@keyframes visomi-loader-draw-1 {0%,21.767477%{stroke-dashoffset:100;opacity:0} 23.017477%{opacity:1} 43.520142%,100%{stroke-dashoffset:0;opacity:1}}
@keyframes visomi-loader-draw-2 {0%,43.520142%{stroke-dashoffset:100;opacity:0} 44.770142%{opacity:1} 68.750000%,100%{stroke-dashoffset:0;opacity:1}}
@media (prefers-reduced-motion:reduce){.visomi-loader-draw{animation:none;stroke-dashoffset:0;opacity:1}.visomi-loader-ink{animation:none;opacity:1}}
</ns0:style>
<ns0:defs>

name: ${COMPOSE_PROJECT_NAME:-visomi-local}

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      # Debe coincidir con DATABASE_URL. No migra una base ya inicializada.
      - POSTGRES_DB=${POSTGRES_DB:-visomi}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - '${HOST_BINDING-127.0.0.1:}${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: ${HEALTHCHECK_INTERVAL:-5s}
      timeout: 5s
      retries: ${HEALTHCHECK_RETRIES:-10}
      start_period: ${HEALTHCHECK_START_PERIOD:-5s}

  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - '${HOST_BINDING-127.0.0.1:}${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: ${HEALTHCHECK_INTERVAL:-5s}
      timeout: 5s
      retries: ${HEALTHCHECK_RETRIES:-10}
      start_period: ${HEALTHCHECK_START_PERIOD:-5s}

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ['server', '/data', '--address', ':9000', '--console-address', ':9001']
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-visomi_local}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-visomi_local_minio_password}
    ports:
      - '${HOST_BINDING-127.0.0.1:}${MINIO_PORT:-9000}:9000'
      - '${HOST_BINDING-127.0.0.1:}${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null']
      interval: ${HEALTHCHECK_INTERVAL:-5s}
      timeout: 5s
      retries: ${HEALTHCHECK_RETRIES:-10}
      start_period: ${HEALTHCHECK_START_PERIOD:-5s}

  minio-init:
    image: docker.io/library/node:24.14.1-alpine
    depends_on:
      minio:
        condition: service_healthy
    working_dir: /workspace
    command: ['node', '--experimental-strip-types', 'initialize-minio-bucket.ts']
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-visomi_local}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-visomi_local_minio_password}
      - OPAQUE_SYNC_S3_BUCKET=${OPAQUE_SYNC_S3_BUCKET:-visomi-opaque-sync}
    volumes:
      - ./scripts/initialize-minio-bucket.ts:/workspace/initialize-minio-bucket.ts:ro

volumes:
  postgres-data:
  redis-data:
  minio-data:


name: ${COMPOSE_PROJECT_NAME:-themis-local-e2e}

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      # podman-compose 1.3.0 does not interpolate variables in environment values.
      POSTGRES_DB: themis_api_e2e
      POSTGRES_USER: themis_api_e2e
      POSTGRES_PASSWORD: themis_api_e2e_password
    ports:
      - '${POSTGRES_PORT:-15432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U themis_api_e2e -d themis_api_e2e']
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - '${REDIS_PORT:-16379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ['server', '/data', '--address', ':9000', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: themis_api_e2e
      MINIO_ROOT_PASSWORD: themis_api_e2e_password
    ports:
      - '${MINIO_PORT:-19000}:9000'
      - '${MINIO_CONSOLE_PORT:-19001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null']
      interval: 2s
      timeout: 5s
      retries: 30

  minio-init:
    image: docker.io/library/node:24.14.1-alpine
    depends_on:
      minio:
        condition: service_healthy
    working_dir: /workspace
    command: ['node', '--experimental-strip-types', 'initialize-minio-bucket.ts']
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: themis_api_e2e
      MINIO_ROOT_PASSWORD: themis_api_e2e_password
      OPAQUE_SYNC_S3_BUCKET: themis-local-e2e-opaque
    volumes:
      - ./scripts/initialize-minio-bucket.ts:/workspace/initialize-minio-bucket.ts:ro

volumes:
  postgres-data:
  minio-data:

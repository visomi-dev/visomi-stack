autoInstallPeers: true
packages:
  - apps/web/edge
packageExtensions:
  # Match astro2tsx's emnapi core because the 2.0 beta runtime crashes Astro typechecking.
  '@astrojs/astro2tsx@0.1.3':
    dependencies:
      '@emnapi/runtime': 1.11.3
allowBuilds:
  nx: true
  unrs-resolver: true
  '@parcel/watcher': false
  esbuild: true
  workerd: true
  lmdb: false
  msgpackr-extract: false
minimumReleaseAgeExclude:
  - '@angular/ssr@22.2.5'
patchedDependencies:
  '@angular/build@22.2.4': patches/@angular__build@22.2.4.patch
  '@angular/ssr@22.2.5': patches/@angular__ssr@22.2.5.patch
  '@astrojs/node@11.1.12': patches/@astrojs__node@11.1.12.patch
  astro@7.4.11: patches/astro@7.4.11.patch

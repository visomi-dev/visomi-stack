name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '20 4 * * 1'

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NX_DAEMON: false

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve affected commit range
        uses: nrwl/nx-set-shas@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: |
          export NX_DAEMON=false
          pnpm exec node --experimental-strip-types scripts/template/checks/affected.ts range "$NX_BASE" "$NX_HEAD" format:check

      - name: Lint affected files and rule consumers
        run: |
          export NX_DAEMON=false
          pnpm exec node --experimental-strip-types scripts/template/checks/affected.ts range "$NX_BASE" "$NX_HEAD" lint

      - name: Typecheck affected projects
        run: |
          export NX_DAEMON=false
          pnpm nx affected -t typecheck browser-build --base="$NX_BASE" --head="$NX_HEAD"

      - name: Run tests
        run: |
          export NX_DAEMON=false
          pnpm exec node --experimental-strip-types scripts/template/checks/affected.ts range "$NX_BASE" "$NX_HEAD" test vite:test --exclude-e2e

      - name: Build composed runtime
        id: runtime
        run: |
          export NX_DAEMON=false
          pnpm nx affected -t build --base="$NX_BASE" --head="$NX_HEAD" --exclude='*,!server'
          pnpm nx show projects --affected --base="$NX_BASE" --head="$NX_HEAD" --json > "$RUNNER_TEMP/affected.json"
          node -e "const fs=require('fs');const names=JSON.parse(fs.readFileSync(process.argv[1]));fs.appendFileSync(process.env.GITHUB_OUTPUT, 'affected='+names.includes('server')+'\\n')" "$RUNNER_TEMP/affected.json"

      - name: Generate release inputs from the built runtime
        if: steps.runtime.outputs.affected == 'true'
        env:
          RELEASE_DIR: ${{ runner.temp }}/themis-release
        run: |
          mkdir -p "$RELEASE_DIR"
          tar -czf "$RELEASE_DIR/themis-server.tgz" -C dist/apps/web/server .
          pnpm exec node --experimental-strip-types scripts/release-gate-fixture.ts \
            "$RELEASE_DIR/themis-server.tgz" "$RELEASE_DIR"

      - name: Run release gate on generated inputs
        if: steps.runtime.outputs.affected == 'true'
        env:
          RELEASE_DIR: ${{ runner.temp }}/themis-release
        run: |
          pnpm run release:gate \
            "$RELEASE_DIR/themis-server.tgz" \
            "$RELEASE_DIR/catalogue-key.pem" \
            "$RELEASE_DIR/themis.release-manifest.json" \
            "$RELEASE_DIR/themis.key-catalogue.json" \
            "$RELEASE_DIR/catalogue-key.pem" \
            "$RELEASE_DIR/release-metadata.json" \
            "$RELEASE_DIR/build.log" \
            "$RELEASE_DIR/telemetry.json"

      - name: Verify release gate fails closed for tampered generated input
        if: steps.runtime.outputs.affected == 'true'
        env:
          RELEASE_DIR: ${{ runner.temp }}/themis-release
        run: |
          printf 'project context: protected\n' >> "$RELEASE_DIR/release-metadata.json"
          if pnpm run release:gate \
            "$RELEASE_DIR/themis-server.tgz" \
            "$RELEASE_DIR/catalogue-key.pem" \
            "$RELEASE_DIR/themis.release-manifest.json" \
            "$RELEASE_DIR/themis.key-catalogue.json" \
            "$RELEASE_DIR/catalogue-key.pem" \
            "$RELEASE_DIR/release-metadata.json" \
            "$RELEASE_DIR/build.log" \
            "$RELEASE_DIR/telemetry.json"; then
            echo 'release gate unexpectedly accepted protected plaintext'
            exit 1
          fi

  template-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: template_smoke
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d template_smoke"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify a renamed clean copy with PostgreSQL
        env:
          SMOKE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/template_smoke
          SMOKE_REDIS_URL: redis://127.0.0.1:6379
        run: |
          export NX_DAEMON=false
          pnpm template:smoke
      - name: Retain redacted smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-smoke-results
          path: tmp/template-smoke-*/result.json
          if-no-files-found: ignore

  critical-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_E2E_MINIO_IMAGE: visomi-minio-e2e:07c3a429
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser matrix
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Build pinned object-storage fixture
        run: |
          export NX_DAEMON=false
          pnpm nx run template:minio-fixture
      - name: Run affected E2E projects and related browser specs
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: |
          export NX_DAEMON=false
          pnpm exec node --experimental-strip-types scripts/template/checks/affected.ts range "$NX_BASE" "$NX_HEAD" e2e
          pnpm nx affected -t test --base="$NX_BASE" --head="$NX_HEAD" --exclude='*,!api-e2e'
      - name: Run full browser and durable API matrix
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          PZS005_ARTIFACT_DIR: tmp/scheduled-api-e2e
        run: |
          export NX_DAEMON=false
          pnpm nx run server:build:production
          pnpm nx run app-e2e:e2e
          pnpm nx run api-e2e:e2e
          pnpm nx run server-e2e:e2e

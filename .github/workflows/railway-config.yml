name: Railway config

on:
  pull_request:
    paths:
      - '.railway/**'
      - '.github/workflows/railway-config.yml'
  push:
    branches: [main]
    paths:
      - '.railway/**'
      - '.github/workflows/railway-config.yml'

permissions:
  contents: read
  actions: read

env:
  RAILWAY_CALLER: skill:use-railway@1.7.0
  RAILWAY_AGENT_SESSION: github-${{ github.run_id }}

jobs:
  plan:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Save the infrastructure plan for review
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: pnpm dlx @railway/cli@5.71.0 config plan --out railway-plan.json
      - uses: actions/upload-artifact@v7
        with:
          name: railway-plan-${{ github.event.pull_request.head.sha }}
          path: railway-plan.json
          retention-days: 14
          if-no-files-found: error

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for CI on this main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f event=push -f head_sha="$GITHUB_SHA" --jq '.workflow_runs[0].id')
            if [ "$run_id" != null ]; then
              break
            fi
            sleep 5
          done
          test "$run_id" != null
          gh run watch "$run_id" --exit-status --interval 10
      - name: Find the successful plan for this PR revision
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_head_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].head.sha')
          test "$pr_head_sha" != null
          run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/railway-config.yml/runs" \
            -f event=pull_request -f head_sha="$pr_head_sha" -f status=success --jq '.workflow_runs[0].id')
          test "$run_id" != null
          echo "head-sha=$pr_head_sha" >> "$GITHUB_OUTPUT"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: railway-plan-${{ steps.plan.outputs.head-sha }}
          run-id: ${{ steps.plan.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Apply the reviewed plan
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: pnpm dlx @railway/cli@5.71.0 config apply --plan railway-plan.json --yes
